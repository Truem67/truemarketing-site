<!DOCTYPE html>
<!-- DoxSeal cert.html v2026.06 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DoxSeal Certificate of Protection</title>
<meta name="description" content="DoxSeal Proof Certificate — permanently sealed, tamper-proof and independently verifiable.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── RESET & VARS ─────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#040f08;--bg2:#071a0e;--card:#0d3018;
  --line:rgba(184,134,11,.13);--line2:rgba(184,134,11,.24);
  --gold:#b8860b;--gold2:#c9a84c;--gold3:#9a6f08;
  --ivory:#f0ead8;--iv2:rgba(240,234,216,.78);
  --iv3:rgba(240,234,216,.48);--iv4:rgba(240,234,216,.26);
  --green:#1a8a53;--green2:#4caf7d;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'DM Sans',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);font-family:var(--sans);color:var(--ivory);
  -webkit-font-smoothing:antialiased;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 90% 55% at 50% 0%,rgba(184,134,11,.05),transparent);z-index:0;}
::selection{background:rgba(184,134,11,.28);}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px;}

/* ── NAV ──────────────────────────────────────────── */
.nav{
  position:sticky;top:0;z-index:100;
  background:rgba(4,15,8,.94);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:0 24px;height:56px;
  display:flex;align-items:center;justify-content:space-between;
}
.nav-brand{display:flex;align-items:center;gap:9px;text-decoration:none;
  font-family:var(--serif);font-size:19px;font-weight:700;color:var(--ivory);}
.nav-brand img{height:28px;width:auto;}
.nav-brand em{font-style:normal;color:var(--gold2);}
.nav-label{font-size:12px;color:var(--iv3);}
.nav-btn{font-size:12px;color:var(--gold2);background:transparent;
  border:1px solid var(--line2);padding:6px 14px;border-radius:8px;
  text-decoration:none;transition:border-color .15s;white-space:nowrap;}
.nav-btn:hover{border-color:var(--gold2);}

/* ── PAGE ─────────────────────────────────────────── */
.page{max-width:600px;margin:0 auto;padding:28px 16px 64px;position:relative;z-index:1;}

/* ── VERIFIED BANNER ──────────────────────────────── */
.vbanner{
  display:flex;align-items:center;gap:16px;
  background:linear-gradient(135deg,rgba(26,138,83,.12),rgba(26,138,83,.06));
  border:2px solid rgba(26,138,83,.36);
  border-radius:16px;padding:20px 24px;margin-bottom:20px;
}
.vbanner-ico{
  width:46px;height:46px;border-radius:50%;flex-shrink:0;
  background:rgba(26,138,83,.18);border:2px solid rgba(26,138,83,.42);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:var(--green2);font-weight:700;
}
.vbanner-title{font-family:var(--serif);font-size:20px;font-weight:700;
  color:var(--green2);line-height:1.2;}
.vbanner-sub{font-size:12px;color:var(--iv3);margin-top:4px;line-height:1.5;}

/* ── CERT CARD ────────────────────────────────────── */
.cert-card{
  background:var(--card);border:1px solid var(--line2);
  border-radius:16px;overflow:hidden;margin-bottom:20px;
}
.cert-bar{height:4px;background:linear-gradient(90deg,var(--gold3),var(--gold2),var(--gold3));}
.cert-inner{padding:22px 24px;}
.cert-head{
  display:flex;align-items:center;gap:12px;
  padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:16px;
}
.cert-head-logo{
  width:40px;height:40px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold3),var(--gold2));
  display:flex;align-items:center;justify-content:center;
}
.cert-head-logo img{height:22px;width:auto;}
.cert-head-title{font-family:var(--serif);font-size:17px;font-weight:700;
  color:var(--ivory);line-height:1.2;}
.cert-head-sub{font-size:10px;color:var(--iv4);margin-top:3px;letter-spacing:.06em;text-transform:uppercase;}

/* ── CERT ROWS ────────────────────────────────────── */
.cert-row{
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:9px 0;border-bottom:1px solid rgba(255,255,255,.04);
  font-size:13px;gap:16px;
}
.cert-row:last-child{border:none;}
.ck{color:var(--iv4);flex-shrink:0;min-width:130px;font-size:11px;
  text-transform:uppercase;letter-spacing:.08em;}
.cv{color:var(--iv2);text-align:right;word-break:break-all;}
.cv.mono{font-family:var(--mono);font-size:10px;color:var(--gold2);}
.cert-row.hero .cv{font-size:15px;font-weight:700;color:var(--ivory);}

/* ── QR ───────────────────────────────────────────── */
.qr-wrap{
  background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:18px 20px;
  display:flex;align-items:center;gap:18px;margin-bottom:20px;
}
.qr-img{width:120px;height:120px;border-radius:8px;flex-shrink:0;}
.qr-title{font-size:13px;font-weight:600;color:var(--ivory);margin-bottom:4px;}
.qr-sub{font-size:12px;color:var(--iv3);line-height:1.6;margin-bottom:8px;}
.qr-url{font-family:var(--mono);font-size:10px;color:var(--gold2);word-break:break-all;line-height:1.6;}

/* ── ACTIONS ──────────────────────────────────────── */
.cert-actions{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.btn-print{
  width:100%;padding:14px;border-radius:14px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--gold3),var(--gold2));
  font-size:14px;font-weight:700;color:#040f08;transition:opacity .15s;
}
.btn-print:hover{opacity:.88;}
.btn-verify{
  display:flex;align-items:center;justify-content:center;
  width:100%;padding:13px;border-radius:14px;text-decoration:none;
  background:transparent;border:1.5px solid var(--line2);
  font-size:13px;font-weight:600;color:var(--iv2);transition:border-color .15s;
}
.btn-verify:hover{border-color:var(--gold2);}

/* ── NOTE ─────────────────────────────────────────── */
.note{
  background:rgba(255,255,255,.02);border:1px solid var(--line);
  border-left:3px solid var(--gold3);border-radius:10px;
  padding:14px 16px;font-size:12px;color:var(--iv3);line-height:1.7;
  margin-bottom:24px;
}
.note strong{color:var(--iv2);}

/* ── NO PARAMS ────────────────────────────────────── */
.empty{text-align:center;padding:64px 24px;}
.empty-title{font-family:var(--serif);font-size:24px;color:var(--ivory);margin-bottom:10px;}
.empty-sub{font-size:14px;color:var(--iv3);margin-bottom:20px;line-height:1.6;}
.empty-link{color:var(--gold2);font-size:14px;text-decoration:none;}

/* ── FOOTER ───────────────────────────────────────── */
.page-footer{
  border-top:1px solid var(--line);padding:18px 24px;position:relative;z-index:1;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:12px;font-size:12px;color:var(--iv4);
}
.footer-links{display:flex;gap:16px;flex-wrap:wrap;}
.footer-links a{color:var(--iv4);text-decoration:none;}
.footer-links a:hover{color:var(--iv2);}

/* ── PRINT ────────────────────────────────────────── */
@media print{
  .nav,.cert-actions,.no-print{display:none!important;}
  body,body::before{background:#fff;color:#111;}
  .page{max-width:100%;padding:0;}
  .cert-card,.qr-wrap,.vbanner,.note{border-color:#ccc;background:#fff;}
  .cert-bar{background:linear-gradient(90deg,#9a6f08,#c9a84c);}
  .vbanner{border-color:#1a8a53;background:#f0fff4;}
  .vbanner-ico,.vbanner-title{color:#1a8a53;}
  .vbanner-sub,.ck,.iv4{color:#666;}
  .cv{color:#111;}.cv.mono{color:#b8860b;}
  .note{background:#fffdf5;border-left-color:#b8860b;}
  .qr-wrap{background:#f9f9f9;}
  .qr-title{color:#111;}.qr-sub{color:#666;}.qr-url{color:#b8860b;}
  .page-footer{border-color:#ddd;}
}
</style>
</head>
<body>

<nav class="nav">
  <a href="https://doxseal.co.za" class="nav-brand">
    <img src="/doxseal-logo-gold.svg" alt="DoxSeal">
    <span><em>Dox</em>Seal</span>
  </a>
  <span class="nav-label">Certificate of Protection</span>
  <a id="nav-verify-btn" href="https://doxseal.co.za/verify.html" class="nav-btn" target="_blank" rel="noopener">Verify</a>
</nav>

<div class="page" id="cert-page"></div>

<footer class="page-footer no-print">
  <span>&#169; 2026 Johan van Eyssen &middot; <b>Dox</b>Seal</span>
  <div class="footer-links">
    <a href="https://doxseal.co.za">Home</a>
    <a href="https://doxseal.co.za/verify.html">Verify</a>
    <a href="https://doxseal.co.za/legal.html">Legal</a>
  </div>
</footer>

<script>
'use strict';
const _p   = new URLSearchParams(window.location.search);
const txid = _p.get('txid') || '';
const subj = _p.get('subj') || '';
const from = _p.get('from') || '';
const to   = _p.get('to')   || '';
const fh   = _p.get('fh')   || '';
const se   = _p.get('se')   || '';
const co   = _p.get('co')   || '';
const ts   = _p.get('ts')   || '';

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function row(label, val, opts){
  if(!val) return '';
  const mono  = opts && opts.mono;
  const hero  = opts && opts.hero;
  return `<div class="cert-row${hero?' hero':''}">
    <span class="ck">${esc(label)}</span>
    <span class="cv${mono?' mono':''}">${esc(val)}</span>
  </div>`;
}

const page = document.getElementById('cert-page');

if(!txid){
  page.innerHTML = `<div class="empty">
    <div class="empty-title">No certificate to display</div>
    <div class="empty-sub">Please use the link from a DoxSeal certificate to open this page.</div>
    <a class="empty-link" href="https://doxseal.co.za/verify.html">Go to verify page &rarr;</a>
  </div>`;
} else {
  const senderDisplay = from ? (co ? `${from} \xB7 ${co}` : from) : (se || '');

  // Reconstruct the verify URL with all available params
  const vParams = new URLSearchParams({ txid });
  if(from) vParams.set('from', from);
  if(se)   vParams.set('se', se);
  if(co)   vParams.set('co', co);
  if(subj) vParams.set('subj', subj);
  if(to)   vParams.set('to', to);
  if(fh)   vParams.set('fh', fh);
  const verifyUrl = 'https://doxseal.co.za/verify.html?' + vParams.toString();

  document.getElementById('nav-verify-btn').href = verifyUrl;

  const qrSrc = 'https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=' + encodeURIComponent(verifyUrl);

  const certTitle = subj ? `"${esc(subj)}"` : 'Document';
  const sealedOn  = ts || 'See verify page';

  page.innerHTML = `
    <div class="vbanner">
      <div class="vbanner-ico">&#10003;</div>
      <div>
        <div class="vbanner-title">Permanently Sealed &middot; Tamper-proof</div>
        <div class="vbanner-sub">This certificate is genuine and permanently recorded. It cannot be altered by any party &mdash; including DoxSeal.</div>
      </div>
    </div>

    <div class="cert-card">
      <div class="cert-bar"></div>
      <div class="cert-inner">
        <div class="cert-head">
          <div class="cert-head-logo">
            <img src="/doxseal-logo-gold.svg" alt="DoxSeal">
          </div>
          <div>
            <div class="cert-head-title">DoxSeal Proof Certificate</div>
            <div class="cert-head-sub">Permanent &middot; Tamper-proof &middot; Independently verifiable</div>
          </div>
        </div>
        ${row('Protected for', to, {hero:true})}
        ${row('Subject', subj)}
        ${row('Sealed by', senderDisplay)}
        ${row('Date sealed', sealedOn)}
        ${row('SHA-256 fingerprint', fh, {mono:true})}
        ${row('Transaction ID', txid, {mono:true})}
      </div>
    </div>

    <div class="qr-wrap no-print">
      <img class="qr-img" id="cert-qr-img" src="" alt="QR code to verify">
      <div>
        <div class="qr-title">Verify independently</div>
        <div class="qr-sub">Scan this QR code or tap Verify Document below. Free, no account required.</div>
        <div class="qr-url">${esc(verifyUrl)}</div>
      </div>
    </div>

    <div class="cert-actions">
      <button class="btn-print" onclick="window.print()">Save as PDF / Print Certificate</button>
      <a class="btn-verify" id="cert-verify-link" href="#" target="_blank" rel="noopener">Verify this document</a>
    </div>

    <div class="note">
      <strong>Permanently recorded.</strong> This certificate is backed by a tamper-proof record that exists independently of DoxSeal. Even if DoxSeal ceased to exist, this certificate would remain verifiable. Use the QR code or verify link to confirm independently at any time.
    </div>
  `;

  // Set src/href via JS to avoid HTML-parser & entity mangling
  document.getElementById('cert-qr-img').src = qrSrc;
  document.getElementById('cert-verify-link').href = verifyUrl;
  document.title = `DoxSeal Certificate — ${subj || txid.slice(0,12)}`;
}
</script>

</body>
</html>

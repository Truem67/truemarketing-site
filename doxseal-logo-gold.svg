<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#040f08"/>
      <stop offset="100%" stop-color="#0a2614"/>
    </linearGradient>
    <linearGradient id="icon-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#9a6f08"/>
      <stop offset="50%"  stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#9a6f08"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#b8860b" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#b8860b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#b8860b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#b8860b" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#b8860b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top gold rule -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#rule)"/>

  <!-- Icon: rounded square -->
  <rect x="552" y="148" width="96" height="96" rx="20" fill="url(#icon-grad)"/>

  <!-- Four-pointed star mark inside icon -->
  <!-- Vertical bar -->
  <rect x="592" y="158" width="16" height="76" rx="8" fill="#040f08"/>
  <!-- Horizontal bar -->
  <rect x="562" y="188" width="76" height="16" rx="8" fill="#040f08"/>
  <!-- Diagonal NW-SE -->
  <rect x="568" y="162" width="12" height="70" rx="6" fill="#040f08" transform="rotate(45 600 196)"/>
  <!-- Diagonal NE-SW -->
  <rect x="568" y="162" width="12" height="70" rx="6" fill="#040f08" transform="rotate(-45 600 196)"/>

  <!-- Wordmark -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="700" text-anchor="middle" x="600" y="330">
    <tspan fill="#c9a84c">Dox</tspan><tspan fill="#f0ead8">Seal</tspan>
  </text>

  <!-- Tagline -->
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="500"
        letter-spacing="4" text-anchor="middle" x="600" y="374"
        fill="#f0ead8" fill-opacity="0.42">
    PERMANENT DOCUMENT SEALING
  </text>

  <!-- Divider rule -->
  <rect x="360" y="406" width="480" height="1" fill="url(#rule)"/>

  <!-- Domain -->
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="17"
        text-anchor="middle" x="600" y="442"
        fill="#f0ead8" fill-opacity="0.28" letter-spacing="1">
    doxseal.co.za
  </text>

  <!-- Bottom gold rule -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#rule)"/>
</svg>

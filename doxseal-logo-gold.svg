<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer orbit ring -->
  <circle cx="150" cy="150" r="138" fill="none" stroke="#b8860b" stroke-width="1" opacity="0.5"/>

  <!-- Outer ring dots -->
  <circle cx="150" cy="12" r="4" fill="#c9a84c"/>
  <circle cx="150" cy="288" r="4" fill="#c9a84c"/>

  <!-- Middle orbit ring -->
  <circle cx="150" cy="150" r="108" fill="none" stroke="#9a6f08" stroke-width="0.8" opacity="0.4"/>

  <!-- Inner orbit ring -->
  <circle cx="150" cy="150" r="78" fill="none" stroke="#b8860b" stroke-width="0.8" opacity="0.35"/>

  <!-- Inner ring dots -->
  <circle cx="150" cy="72" r="3" fill="#b8860b" opacity="0.7"/>
  <circle cx="150" cy="228" r="3" fill="#b8860b" opacity="0.7"/>

  <!-- Glowing core circle -->
  <defs>
    <radialGradient id="coreGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="1"/>
      <stop offset="45%" stop-color="#b8860b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4a2800" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b8860b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#b8860b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer glow behind core -->
  <circle cx="150" cy="150" r="72" fill="url(#glowGrad)"/>

  <!-- Core circle -->
  <circle cx="150" cy="150" r="58" fill="url(#coreGrad)"/>

  <!-- 4-pointed star / compass rose -->
  <path d="
    M150 105
    C150 105 155 140 160 150
    C155 160 150 195 150 195
    C150 195 145 160 140 150
    C145 140 150 105 150 105
    Z
  " fill="white" opacity="0.95" filter="url(#glow)"/>
  <path d="
    M105 150
    C105 150 140 145 150 140
    C160 145 195 150 195 150
    C195 150 160 155 150 160
    C140 155 105 150 105 150
    Z
  " fill="white" opacity="0.95"/>
</svg>
